[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# Distribution name on PyPI. Differs from the import name `rustytree`
# (which stays unchanged in code, docs, and the xarray entrypoint
# `engine="rustytree"`) because the canonical PyPI name `rustytree`
# collides with the dormant `rusty-tree` project (PyPI normalizes
# `-`/`_`/case so they collapse). Users `pip install rustytree-xarray`,
# then `import rustytree`.
name = "rustytree-xarray"
version = "0.2.1"
description = "Rust-backed xarray DataTree backend for fast Zarr access from object storage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alfonso Ladino", email = "alfonso@atmoscale.ai" },
]
keywords = ["xarray", "zarr", "datatree", "rust", "object-storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "xarray>=2024.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "zarr>=3.0",
    # Pin to icechunk's 2.1 minor: the msgpack `Session` bytes format is coupled
    # to the icechunk version rustytree's Rust extension links (`=2.1.0`), so the
    # Python and Rust icechunk must share a minor or `Session::from_bytes` fails
    # to recognise the store (the 2.0.5-vs-2.0.6 skew that motivated this bump).
    "icechunk>=2.1.0,<2.2",
    # Pin ruff's minor so local dev and the CI `lint` job agree on formatting
    # rules — ruff can change its stable formatter across minors, which would
    # otherwise make `ruff format --check` pass locally but fail in CI (or vice
    # versa) purely on a version skew.
    "ruff>=0.15.8,<0.16",
    # Exercises the issue-#44 regression: computing rustytree arrays under a
    # real dask.distributed LocalCluster (see the `distributed` marker).
    "dask[distributed]>=2024.1",
]

[project.urls]
Homepage = "https://github.com/aladinor/rustytree"
Repository = "https://github.com/aladinor/rustytree"

# xarray plugin discovery hook. With this, `xr.open_datatree(url, engine="rustytree")`
# will resolve to RustytreeBackendEntrypoint via importlib.metadata.entry_points.
[project.entry-points."xarray.backends"]
rustytree = "rustytree.backend:RustytreeBackendEntrypoint"

[tool.maturin]
module-name = "rustytree._rustytree"
python-source = "python"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "distributed: exercises a real dask.distributed LocalCluster (opt-in; needs `distributed`)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
